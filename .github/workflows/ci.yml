name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install gateway dependencies
        run: |
          cd gateway
          pip install -r requirements.txt -q
          # Toolchain is PINNED: on 2026-08-14 an unpinned 'ruff' picked up a new
          # release whose rule changes produced 128 errors on untouched code and
          # broke every open PR at once. Versions below are the locally-verified
          # known-good set; bump them deliberately, with the repo lint-clean.
          # (pytest-mock was removed — nothing in the repo uses it.)
          pip install "pytest==9.0.2" "pytest-asyncio==1.3.0" "ruff==0.15.6" "pip-audit==2.10.0" -q

      - name: Audit gateway dependencies for CVEs
        run: |
          cd gateway
          # Two advisories are suppressed here. Both are unreachable in this codebase and
          # both trace back to python-jose; migrating to PyJWT retires both suppressions.
          #
          # PYSEC-2025-185 — DoS in python-jose's jwe.decrypt path. This codebase only uses
          # signed JWTs (jwt.encode/jwt.decode in auth.py and auth_service.py), never JWE,
          # so the vulnerable path is unreachable.
          #
          # PYSEC-2026-1325 (= CVE-2024-23342) — Minerva timing attack on P-256 in `ecdsa`,
          # a transitive dependency of python-jose. Upstream treats side-channel attacks as
          # out of scope and declared it WONTFIX, so there is no fixed version to bump to.
          # The vulnerable code is structurally unreachable, not merely unused by config:
          # every `ecdsa` import in python-jose 3.5.0 (backends/__init__.py, utils.py) sits
          # in an `except ImportError` fallback that fires only when `cryptography` is
          # absent, and the [cryptography] extra guarantees it is present. ECKey therefore
          # binds to CryptographyECKey and `ecdsa` never enters sys.modules — verified to
          # hold even for an ES256 round-trip. Our JWTs are HS256 (HMAC,
          # config.py:jwt_algorithm) and touch no EC code at all.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2025-185 \
            --ignore-vuln PYSEC-2026-1325

      - name: Lint gateway, CLI, and satellite
        run: |
          cd gateway && ruff check app/ tests/ && cd ..
          ruff check cli/ satellite_storage/

      - name: Test gateway
        run: |
          cd gateway
          pytest tests/ -v

      - name: Type check webapp
        run: |
          cd webapp
          npm install --silent
          npx tsc --noEmit

      # The satellite package requires Python >=3.13 (gateway stays on 3.12 above),
      # so the remaining suites run on their own interpreter.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test CLI, satellite, and training suites
        run: |
          pip install -e . -q
          pip install -e ./satellite_storage -q
          pip install pytest pytest-asyncio -q
          # Assert collection counts before running: a green-but-empty run
          # (import error, renamed dir, pattern drift) must fail loudly.
          # -o addopts= neutralizes ini addopts (gateway sets -v, which cancels
          # -q and drops the '::' nodeid lines); || true keeps bash -e from
          # killing the assignment when grep matches nothing.
          run_tree() {
            local tree=$1 min=$2 n
            n=$(pytest "$tree" --collect-only -q -o addopts= 2>/dev/null | grep -c '::' || true)
            if [ "$n" -lt "$min" ]; then
              echo "::error::$tree collected only $n tests (expected >= $min)"
              exit 1
            fi
            pytest "$tree" -q
          }
          run_tree cli/tests 62
          run_tree satellite_storage/tests 83
          run_tree gateway/training/tests 28
